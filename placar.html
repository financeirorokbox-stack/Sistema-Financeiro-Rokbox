<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Placar Rokbox</title>
<style>
  :root{
    --bg:#0b0f0d; --bg2:#121a16; --card:#16211b; --line:#233029;
    --txt:#eafaf1; --muted:#8fa89a; --lime:#7ee787; --lime2:#39d353;
    --gold:#ffd76a; --blue:#7cc4ff; --pink:#ff9ecb; --amber:#ffb347;
    --shadow:0 8px 30px rgba(0,0,0,.35);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--txt);font-family:'Segoe UI',system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
  body{min-height:100vh;padding:clamp(14px,2.2vw,34px);background:radial-gradient(1200px 600px at 80% -10%,#16241c 0%,var(--bg) 55%)}
  .wrap{max-width:1700px;margin:0 auto}
  /* header */
  header{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:clamp(14px,1.8vw,26px)}
  .brand{display:flex;align-items:center;gap:14px}
  .logo{font-weight:800;font-size:clamp(22px,2.4vw,38px);letter-spacing:.5px}
  .logo b{color:var(--lime)}
  .sub{color:var(--muted);font-size:clamp(12px,1vw,15px);margin-top:2px}
  .live{display:flex;align-items:center;gap:9px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:8px 16px;font-size:clamp(12px,1vw,15px);color:var(--muted)}
  .dot{width:10px;height:10px;border-radius:50%;background:var(--lime2);box-shadow:0 0 0 0 rgba(57,211,83,.6);animation:pulse 1.8s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(57,211,83,.55)}70%{box-shadow:0 0 0 12px rgba(57,211,83,0)}100%{box-shadow:0 0 0 0 rgba(57,211,83,0)}}
  .seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px}
  .seg button{background:none;border:0;color:var(--muted);font-weight:700;font-size:clamp(12px,1vw,15px);padding:7px 18px;border-radius:999px;cursor:pointer;transition:.15s}
  .seg button.on{background:var(--lime);color:#08130b}
  /* top cards */
  .tops{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:clamp(10px,1.2vw,18px);margin-bottom:clamp(12px,1.5vw,22px)}
  .card{background:linear-gradient(180deg,var(--card),var(--bg2));border:1px solid var(--line);border-radius:20px;padding:clamp(16px,1.8vw,28px);box-shadow:var(--shadow)}
  .card .lab{color:var(--muted);font-size:clamp(12px,1vw,15px);font-weight:700;text-transform:uppercase;letter-spacing:1px}
  .big{font-size:clamp(30px,4.6vw,72px);font-weight:800;line-height:1.02;margin-top:8px;color:var(--lime)}
  .big.small{font-size:clamp(26px,3.4vw,52px);color:var(--txt)}
  .cardrow{display:flex;gap:24px;flex-wrap:wrap;margin-top:10px}
  .kv .k{color:var(--muted);font-size:clamp(11px,.9vw,14px)}
  .kv .v{font-size:clamp(18px,1.7vw,26px);font-weight:700}
  /* rankings */
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:clamp(10px,1.2vw,18px)}
  h2{font-size:clamp(15px,1.3vw,20px);margin-bottom:14px;display:flex;align-items:center;gap:10px}
  h2 .pill{font-size:11px;color:#08130b;background:var(--gold);border-radius:999px;padding:2px 9px;font-weight:800}
  .rank{display:flex;flex-direction:column;gap:clamp(9px,1vw,14px)}
  .row{display:grid;grid-template-columns:30px 1fr auto;align-items:center;gap:12px}
  .pos{font-weight:800;color:var(--muted);font-size:clamp(14px,1.2vw,19px);text-align:center}
  .row:nth-child(1) .pos{color:var(--gold)}
  .bar-wrap{min-width:0}
  .bar-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:5px}
  .nm{font-weight:700;font-size:clamp(14px,1.25vw,20px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .qt{color:var(--muted);font-size:clamp(11px,.9vw,14px)}
  .val{font-weight:800;font-size:clamp(15px,1.35vw,21px);white-space:nowrap}
  .bar{height:clamp(8px,.7vw,11px);background:#0d1712;border-radius:999px;overflow:hidden}
  .bar > i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--lime2),var(--lime));transition:width .8s cubic-bezier(.22,1,.36,1)}
  .row:nth-child(2) .bar>i{background:linear-gradient(90deg,#2b9be0,var(--blue))}
  .row:nth-child(3) .bar>i{background:linear-gradient(90deg,#d98a2b,var(--amber))}
  /* status strip */
  .status{margin-top:clamp(12px,1.5vw,22px)}
  .chips{display:flex;flex-wrap:wrap;gap:10px}
  .chip{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 15px;display:flex;align-items:center;gap:10px}
  .chip .cn{font-size:clamp(12px,1vw,15px);color:var(--muted)}
  .chip .cc{font-weight:800;font-size:clamp(15px,1.3vw,20px)}
  .chip .cd{width:9px;height:9px;border-radius:50%}
  .foot{margin-top:18px;color:var(--muted);font-size:clamp(11px,.85vw,13px);text-align:center}
  @media(max-width:900px){.tops{grid-template-columns:1fr 1fr}.tops .card:first-child{grid-column:1/-1}.grid2{grid-template-columns:1fr}}
  @media(max-width:560px){.tops{grid-template-columns:1fr}}
  .loading{opacity:.5}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <div>
        <div class="logo">ROK<b>BOX</b> · Placar</div>
        <div class="sub" id="sub">carregando vendas…</div>
      </div>
    </div>
    <div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap">
      <div class="seg" id="seg">
        <button data-p="hoje" class="on">Hoje</button>
        <button data-p="mes">Mês</button>
      </div>
      <div class="live"><span class="dot"></span><span id="upd">—</span></div>
    </div>
  </header>

  <section class="tops">
    <div class="card">
      <div class="lab" id="lab-total">Vendas de hoje</div>
      <div class="big" id="v-total">R$ 0,00</div>
      <div class="cardrow">
        <div class="kv"><div class="k">Pedidos</div><div class="v" id="v-qtd">0</div></div>
        <div class="kv"><div class="k">Ticket médio</div><div class="v" id="v-ticket">R$ 0,00</div></div>
      </div>
    </div>
    <div class="card">
      <div class="lab">🏆 Top vendedor</div>
      <div class="big small" id="top-vend">—</div>
      <div class="cardrow"><div class="kv"><div class="k" id="top-vend-sub">—</div></div></div>
    </div>
    <div class="card">
      <div class="lab">🏬 Top loja</div>
      <div class="big small" id="top-loja">—</div>
      <div class="cardrow"><div class="kv"><div class="k" id="top-loja-sub">—</div></div></div>
    </div>
  </section>

  <section class="grid2">
    <div class="card">
      <h2>Ranking por vendedor <span class="pill" id="pill-v">—</span></h2>
      <div class="rank" id="rank-vend"></div>
    </div>
    <div class="card">
      <h2>Ranking por loja <span class="pill" id="pill-l">—</span></h2>
      <div class="rank" id="rank-loja"></div>
    </div>
  </section>

  <section class="status card" style="margin-top:16px">
    <h2>Situação dos pedidos <span style="color:var(--muted);font-weight:400;font-size:.8em">(todos os status do mês)</span></h2>
    <div class="chips" id="chips"></div>
  </section>

  <div class="foot" id="foot">Rokbox · Placar de vendas ao vivo</div>
</div>

<script>
const SUPA_URL = 'https://xqpqweknlafgtvosqxia.supabase.co';
const SUPA_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhxcHF3ZWtubGFmZ3R2b3NxeGlhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE4OTc1ODMsImV4cCI6MjA5NzQ3MzU4M30.mkMXfCyLXRqeTZfg3telhOsh7B430RDgJsr4i6DBmbo';
const DEV = 'rokbox_financeiro';
const VENDA = new Set(['Verificado','Em separação','Atendido','Checkout parcial','Em aberto']);
const OCULTAR = new Set(['Atualização de estoque','Correios']); // status que nao aparecem na faixa (por enqto)
// Lojas de operação "Amostra" (não são venda) — ficam de fora do placar; mantém só Venda e Troca
const AMOSTRA = new Set(['Marketing - Parceria','Retirada Funcionários','Brinde','Envio de Planos','Brinde Atacado','Marketing - Parceria At','Parceria PL','Mostruário']);
const STCOR = {'Verificado':'#7ee787','Em separação':'#ffb347','Atendido':'#39d353','Checkout parcial':'#7cc4ff','Em aberto':'#ffd76a','Correios':'#8fa89a','Atualização de estoque':'#ff9ecb','Cancelado':'#e5534b'};
const brl = n => 'R$ ' + (n||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const nf = n => (n||0).toLocaleString('pt-BR');
let periodo = 'hoje';
let dados = null;

function hojeISO(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }

async function carregar(){
  try{
    const r = await fetch(`${SUPA_URL}/rest/v1/sistema_dados?device_id=eq.${DEV}&chave=eq.blingVendasRico&select=valor`,{headers:{apikey:SUPA_KEY,Authorization:'Bearer '+SUPA_KEY}});
    const j = await r.json();
    if(Array.isArray(j)&&j[0]) dados = JSON.parse(j[0].valor);
    render();
  }catch(e){ document.getElementById('sub').textContent='sem conexão, tentando de novo…'; }
}

function agrupa(regs, campo){
  const m={};
  regs.forEach(x=>{const k=x[campo]||'(sem)'; m[k]=m[k]||{n:0,v:0}; m[k].n++; m[k].v+=x.valor;});
  return Object.entries(m).map(([k,o])=>({nome:k,...o})).sort((a,b)=>b.v-a.v);
}
function barras(el, arr){
  const max = arr.length?arr[0].v:1;
  el.innerHTML = arr.slice(0,6).map((x,i)=>`
    <div class="row">
      <div class="pos">${i+1}</div>
      <div class="bar-wrap">
        <div class="bar-top"><span class="nm">${x.nome}</span><span class="val">${brl(x.v)}</span></div>
        <div class="bar"><i style="width:${Math.max(3,x.v/max*100)}%"></i></div>
      </div>
      <div class="qt">${x.n} ped</div>
    </div>`).join('') || '<div class="qt">sem vendas no período</div>';
}

function render(){
  if(!dados){return;}
  const hj = hojeISO();
  const regsMes = (dados.registros||[]).filter(x=>!AMOSTRA.has(x.loja)); // só Venda e Troca (sem Amostra)
  // rótulos bonitos p/ cadastro incompleto na Bling (some sozinho quando preencherem loja/vendedor lá)
  regsMes.forEach(x=>{ if(typeof x.loja==='string' && x.loja.indexOf('loja#')===0) x.loja='Sem loja'; if(x.vendedor==='(sem)') x.vendedor='Sem vendedor'; });
  const vendasMes = regsMes.filter(x=>VENDA.has(x.situacao));
  const base = periodo==='hoje' ? vendasMes.filter(x=>x.data===hj) : vendasMes;

  // total
  const tot = base.reduce((s,x)=>s+x.valor,0), q = base.length;
  document.getElementById('lab-total').textContent = periodo==='hoje'?'Vendas de hoje':'Vendas do mês';
  document.getElementById('v-total').textContent = brl(tot);
  document.getElementById('v-qtd').textContent = nf(q);
  document.getElementById('v-ticket').textContent = brl(q?tot/q:0);

  // rankings
  const rv = agrupa(base,'vendedor'), rl = agrupa(base,'loja');
  barras(document.getElementById('rank-vend'), rv);
  barras(document.getElementById('rank-loja'), rl);
  document.getElementById('pill-v').textContent = periodo==='hoje'?'hoje':'mês';
  document.getElementById('pill-l').textContent = periodo==='hoje'?'hoje':'mês';

  // top cards
  if(rv[0]){document.getElementById('top-vend').textContent=rv[0].nome;document.getElementById('top-vend-sub').textContent=brl(rv[0].v)+' · '+rv[0].n+' pedidos';}
  else{document.getElementById('top-vend').textContent='—';document.getElementById('top-vend-sub').textContent='sem vendas';}
  if(rl[0]){document.getElementById('top-loja').textContent=rl[0].nome;document.getElementById('top-loja-sub').textContent=brl(rl[0].v)+' · '+rl[0].n+' pedidos';}
  else{document.getElementById('top-loja').textContent='—';document.getElementById('top-loja-sub').textContent='sem vendas';}

  // status (sempre do mês) — oculta os que ela não quer ver por enquanto
  const st = agrupa(regsMes.filter(x=>!OCULTAR.has(x.situacao)),'situacao');
  document.getElementById('chips').innerHTML = st.map(x=>`
    <div class="chip"><span class="cd" style="background:${STCOR[x.nome]||'#8fa89a'}"></span>
    <span class="cn">${x.nome}</span><span class="cc">${x.n}</span></div>`).join('');

  // header
  const mesNome = new Date((dados.mes||hj)+'-01T12:00:00').toLocaleDateString('pt-BR',{month:'long',year:'numeric'});
  document.getElementById('sub').textContent = `${nf(vendasMes.length)} vendas em ${mesNome}`;
  const upd = dados.atualizado? new Date(dados.atualizado): new Date();
  document.getElementById('upd').textContent = 'atualizado ' + upd.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
  document.getElementById('foot').textContent = `Rokbox · Placar ao vivo · dados de ${mesNome} · ${brl(vendasMes.reduce((s,x)=>s+x.valor,0))} no mês`;
}

document.getElementById('seg').addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b)return;
  periodo=b.dataset.p;
  [...document.querySelectorAll('#seg button')].forEach(x=>x.classList.toggle('on',x===b));
  render();
});

carregar();
setInterval(carregar, 60000); // atualiza a cada 60s
</script>
</body>
</html>
