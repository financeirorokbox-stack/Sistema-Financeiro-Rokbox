<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Placar Rokbox</title>
<style>
  :root{
    --bg:#0b0f0d; --bg2:#121a16; --card:#16211b; --line:#233029;
    --txt:#eafaf1; --muted:#8fa89a; --lime:#7ee787; --lime2:#39d353;
    --gold:#ffd76a; --blue:#7cc4ff; --blue2:#2b9be0; --amber:#ffb347;
    --shadow:0 8px 30px rgba(0,0,0,.35);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--txt);font-family:'Segoe UI',system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
  body{min-height:100vh;padding:clamp(12px,2vw,30px);background:radial-gradient(1200px 600px at 80% -10%,#16241c 0%,var(--bg) 55%)}
  .wrap{max-width:1700px;margin:0 auto}
  header{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:clamp(12px,1.5vw,22px)}
  .logo{font-weight:800;font-size:clamp(22px,2.4vw,38px);letter-spacing:.5px}
  .logo b{color:var(--lime)}
  .sub{color:var(--muted);font-size:clamp(12px,1vw,15px);margin-top:2px}
  .ctrl{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
  .live{display:flex;align-items:center;gap:9px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:8px 16px;font-size:clamp(12px,1vw,15px);color:var(--muted)}
  .dot{width:10px;height:10px;border-radius:50%;background:var(--lime2);box-shadow:0 0 0 0 rgba(57,211,83,.6);animation:pulse 1.8s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(57,211,83,.55)}70%{box-shadow:0 0 0 12px rgba(57,211,83,0)}100%{box-shadow:0 0 0 0 rgba(57,211,83,0)}}
  .seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px}
  .seg button{background:none;border:0;color:var(--muted);font-weight:700;font-size:clamp(12px,1vw,15px);padding:7px 18px;border-radius:999px;cursor:pointer;transition:.15s}
  .seg button.on{background:var(--lime);color:#08130b}
  .card{background:linear-gradient(180deg,var(--card),var(--bg2));border:1px solid var(--line);border-radius:20px;padding:clamp(15px,1.6vw,26px);box-shadow:var(--shadow)}
  /* cards de total em cima */
  .tops{display:grid;grid-template-columns:1fr 1fr 1fr;gap:clamp(10px,1.2vw,18px);margin-bottom:clamp(10px,1.2vw,18px)}
  .tlab{display:flex;align-items:center;gap:9px;font-size:clamp(14px,1.3vw,20px);font-weight:800}
  .col-tot{font-size:clamp(26px,3.4vw,54px);font-weight:800;line-height:1.02;margin:8px 0 6px;color:var(--lime)}
  .seg-atacado .col-tot{color:var(--blue)}
  .tsub{color:var(--muted);font-size:clamp(12px,1vw,15px);font-weight:600}
  .badge{width:12px;height:12px;border-radius:4px;background:var(--lime)}
  .seg-atacado .badge{background:var(--blue)}
  /* colunas de vendedores */
  .segs{display:grid;grid-template-columns:1fr 1fr;gap:clamp(10px,1.2vw,18px)}
  .col-name{font-size:clamp(15px,1.4vw,21px);font-weight:800;display:flex;align-items:center;gap:9px;margin-bottom:14px;padding-bottom:11px;border-bottom:1px solid var(--line)}
  .col-name .tag{margin-left:auto;font-size:.62em;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:1px}
  .rank{display:flex;flex-direction:column;gap:clamp(8px,.9vw,12px)}
  .row{display:grid;grid-template-columns:26px 1fr auto;align-items:center;gap:10px}
  .pos{font-weight:800;color:var(--muted);font-size:clamp(13px,1.1vw,17px);text-align:center}
  .row:nth-child(1) .pos{color:var(--gold)}
  .bar-wrap{min-width:0}
  .bar-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:4px}
  .nm{font-weight:700;font-size:clamp(13px,1.1vw,18px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .val{font-weight:800;font-size:clamp(13px,1.15vw,19px);white-space:nowrap}
  .qt{color:var(--muted);font-size:clamp(10px,.85vw,13px);white-space:nowrap}
  .bar{height:clamp(7px,.6vw,10px);background:#0d1712;border-radius:999px;overflow:hidden}
  .bar>i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--lime2),var(--lime));transition:width .8s cubic-bezier(.22,1,.36,1)}
  .seg-atacado .bar>i{background:linear-gradient(90deg,var(--blue2),var(--blue))}
  .empty{color:var(--muted);font-size:13px;padding:6px 0}
  .lojas{margin-top:clamp(12px,1.4vw,20px)}
  .lojas h2,.status h2{font-size:clamp(14px,1.2vw,19px);margin-bottom:14px}
  .lojas h2 span,.status h2 span{color:var(--muted);font-weight:400;font-size:.8em}
  .lojas-grid{display:grid;grid-template-columns:1fr 1fr;gap:clamp(9px,1vw,13px) clamp(24px,3vw,54px)}
  @media(max-width:820px){.tops{grid-template-columns:1fr}.segs{grid-template-columns:1fr}.lojas-grid{grid-template-columns:1fr}}
  .status{margin-top:clamp(12px,1.4vw,20px)}
  .chips{display:flex;flex-wrap:wrap;gap:10px}
  .chip{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px 14px;display:flex;align-items:center;gap:9px}
  .chip .cn{font-size:clamp(12px,1vw,15px);color:var(--muted)}
  .chip .cc{font-weight:800;font-size:clamp(14px,1.2vw,19px)}
  .chip .cd{width:9px;height:9px;border-radius:50%}
  .foot{margin-top:16px;color:var(--muted);font-size:clamp(11px,.85vw,13px);text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <div class="logo">ROK<b>BOX</b> · Placar</div>
      <div class="sub" id="sub">carregando vendas…</div>
    </div>
    <div class="ctrl">
      <div class="seg" id="seg">
        <button data-p="hoje" class="on">Hoje</button>
        <button data-p="mes">Mês</button>
      </div>
      <div class="live"><span class="dot"></span><span id="upd">—</span></div>
    </div>
  </header>

  <!-- CARDS DE TOTAL (em cima) -->
  <section class="tops">
    <div class="card seg-varejo">
      <div class="tlab"><span class="badge"></span>🛍️ Varejo</div>
      <div class="col-tot" id="Varejo-tot">R$ 0,00</div>
      <div class="tsub" id="Varejo-sub">0 pedidos · 0 peças</div>
    </div>
    <div class="card seg-atacado">
      <div class="tlab"><span class="badge"></span>📦 Atacado</div>
      <div class="col-tot" id="Atacado-tot">R$ 0,00</div>
      <div class="tsub" id="Atacado-sub">0 pedidos · 0 peças</div>
    </div>
    <div class="card">
      <div class="tlab">🟰 Total geral</div>
      <div class="col-tot" id="Geral-tot" style="color:var(--txt)">R$ 0,00</div>
      <div class="tsub" id="Geral-sub">0 pedidos · 0 peças</div>
    </div>
  </section>

  <!-- RANKING VENDEDORES (Varejo | Atacado) -->
  <section class="segs">
    <div class="card seg-varejo">
      <div class="col-name"><span class="badge"></span>🛍️ Varejo <span class="tag">vendedores</span></div>
      <div class="rank" id="Varejo-rank-v"></div>
    </div>
    <div class="card seg-atacado">
      <div class="col-name"><span class="badge"></span>📦 Atacado <span class="tag">vendedores</span></div>
      <div class="rank" id="Atacado-rank-v"></div>
    </div>
  </section>

  <!-- RANKING LOJAS (todas, largura total) -->
  <section class="card lojas">
    <h2>Ranking de lojas <span>(todas · <b id="loja-per">hoje</b>)</span></h2>
    <div class="rank lojas-grid" id="rank-lojas"></div>
  </section>

  <section class="card lojas" style="margin-top:16px">
    <h2>Ranking por status <span>(<b id="status-per">mês</b>)</span></h2>
    <div class="rank lojas-grid" id="rank-status"></div>
  </section>

  <div class="foot" id="foot">Rokbox · Placar de vendas ao vivo</div>
</div>

<script>
const SUPA_URL = 'https://xqpqweknlafgtvosqxia.supabase.co';
const SUPA_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhxcHF3ZWtubGFmZ3R2b3NxeGlhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE4OTc1ODMsImV4cCI6MjA5NzQ3MzU4M30.mkMXfCyLXRqeTZfg3telhOsh7B430RDgJsr4i6DBmbo';
const DEV = 'rokbox_financeiro';
const VENDA = new Set(['Verificado','Em separação','Atendido','Checkout parcial','Em aberto']);
const OCULTAR = new Set(['Atualização de estoque','Correios']);
// Lojas que NÃO entram no placar: operação Amostra + Trocas (troca nem sempre tem venda junto). Fica só venda.
const AMOSTRA = new Set(['Marketing - Parceria','Retirada Funcionários','Brinde','Envio de Planos','Brinde Atacado','Marketing - Parceria At','Parceria PL','Mostruário','Troca','Troca Atacado']);
const ATACADO = new Set(['Atacado','Troca Atacado','Brinde Atacado','Marketing - Parceria At']);
const STCOR = {'Verificado':'#7ee787','Em separação':'#ffb347','Atendido':'#39d353','Checkout parcial':'#7cc4ff','Em aberto':'#ffd76a','Correios':'#8fa89a','Atualização de estoque':'#ff9ecb','Cancelado':'#e5534b'};
const segDe = loja => ATACADO.has(loja) ? 'Atacado' : 'Varejo';
const brl = n => 'R$ ' + (n||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const nf = n => (n||0).toLocaleString('pt-BR');
let periodo = 'hoje';
let dados = null;

function hojeISO(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }

async function carregar(){
  try{
    const r = await fetch(`${SUPA_URL}/rest/v1/sistema_dados?device_id=eq.${DEV}&chave=eq.blingVendasRico&select=valor`,{headers:{apikey:SUPA_KEY,Authorization:'Bearer '+SUPA_KEY}});
    const j = await r.json();
    if(Array.isArray(j)&&j[0]) dados = JSON.parse(j[0].valor);
    render();
  }catch(e){ document.getElementById('sub').textContent='sem conexão, tentando de novo…'; }
}
function agrupa(regs, campo){
  const m={};
  regs.forEach(x=>{const k=x[campo]||'(sem)'; m[k]=m[k]||{n:0,v:0}; m[k].n++; m[k].v+=x.valor;});
  return Object.entries(m).map(([k,o])=>({nome:k,...o})).sort((a,b)=>b.v-a.v);
}
function barras(el, arr, max, opts){
  opts = opts||{}; const lim = opts.limit||5;
  el.innerHTML = arr.slice(0,lim).map((x,i)=>{
    const bg = opts.colorFn ? `;background:${opts.colorFn(x.nome)}` : '';
    return `<div class="row">
      <div class="pos">${i+1}</div>
      <div class="bar-wrap">
        <div class="bar-top"><span class="nm">${x.nome}</span><span class="val">${brl(x.v)}</span></div>
        <div class="bar"><i style="width:${Math.max(3,x.v/(max||1)*100)}%${bg}"></i></div>
      </div>
      <div class="qt">${x.n} ped</div>
    </div>`;}).join('') || '<div class="empty">sem vendas no período</div>';
}
const corLoja = n => segDe(n)==='Atacado' ? 'linear-gradient(90deg,var(--blue2),var(--blue))' : 'linear-gradient(90deg,var(--lime2),var(--lime))';

function cardTotal(S, regs){
  const tot = regs.reduce((s,x)=>s+x.valor,0), q = regs.length;
  const pcs = regs.reduce((s,x)=>s+(x.pecas||0),0);
  document.getElementById(S+'-tot').textContent = brl(tot);
  document.getElementById(S+'-sub').textContent = `${nf(q)} pedidos · ${nf(pcs)} peças · ticket ${brl(q?tot/q:0)}`;
  return {tot,q,pcs};
}
function render(){
  if(!dados){return;}
  const hj = hojeISO();
  const regsMes = (dados.registros||[]).filter(x=>!AMOSTRA.has(x.loja));
  regsMes.forEach(x=>{ if(typeof x.loja==='string' && x.loja.indexOf('loja#')===0) x.loja='Sem loja'; if(x.vendedor==='(sem)') x.vendedor='Sem vendedor'; });
  const vendasMes = regsMes.filter(x=>VENDA.has(x.situacao));
  const base = periodo==='hoje' ? vendasMes.filter(x=>x.data===hj) : vendasMes;

  const bV = base.filter(x=>segDe(x.loja)==='Varejo');
  const bA = base.filter(x=>segDe(x.loja)==='Atacado');
  // cards de total (em cima)
  const rV = cardTotal('Varejo', bV), rA = cardTotal('Atacado', bA);
  document.getElementById('Geral-tot').textContent = brl(rV.tot+rA.tot);
  document.getElementById('Geral-sub').textContent = `${nf(rV.q+rA.q)} pedidos · ${nf(rV.pcs+rA.pcs)} peças`;
  // rankings vendedores
  const rvV = agrupa(bV,'vendedor'), rvA = agrupa(bA,'vendedor');
  barras(document.getElementById('Varejo-rank-v'), rvV, rvV.length?rvV[0].v:1);
  barras(document.getElementById('Atacado-rank-v'), rvA, rvA.length?rvA[0].v:1);
  // ranking lojas (todas, largura total)
  const rl = agrupa(base,'loja');
  barras(document.getElementById('rank-lojas'), rl, rl.length?rl[0].v:1, { limit:12, colorFn:corLoja });
  document.getElementById('loja-per').textContent = periodo==='hoje'?'hoje':'mês';

  // ranking por status (segue o período Hoje/Mês; mostra valor + qtd; cor de cada status)
  const stBase = (periodo==='hoje' ? regsMes.filter(x=>x.data===hj) : regsMes).filter(x=>!OCULTAR.has(x.situacao));
  const rst = agrupa(stBase,'situacao');
  barras(document.getElementById('rank-status'), rst, rst.length?rst[0].v:1, { limit:8, colorFn:n=>`linear-gradient(90deg, ${STCOR[n]||'#8fa89a'}, ${STCOR[n]||'#8fa89a'})` });
  document.getElementById('status-per').textContent = periodo==='hoje'?'hoje':'mês';

  const mesNome = new Date((dados.mes||hj)+'-01T12:00:00').toLocaleDateString('pt-BR',{month:'long',year:'numeric'});
  document.getElementById('sub').textContent = `${nf(vendasMes.length)} vendas em ${mesNome} · ${periodo==='hoje'?'vendo HOJE':'vendo o MÊS'}`;
  const upd = dados.atualizado? new Date(dados.atualizado): new Date();
  document.getElementById('upd').textContent = 'atualizado ' + upd.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
  document.getElementById('foot').textContent = `Rokbox · Placar ao vivo · ${mesNome} · ${brl(vendasMes.reduce((s,x)=>s+x.valor,0))} no mês (Varejo + Atacado)`;
}
function setPeriodo(p){
  periodo=p;
  [...document.querySelectorAll('#seg button')].forEach(x=>x.classList.toggle('on',x.dataset.p===p));
  render();
}
let autoTimer;
function startAuto(){ clearInterval(autoTimer); autoTimer=setInterval(()=>setPeriodo(periodo==='hoje'?'mes':'hoje'), 60000); }
document.getElementById('seg').addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b)return;
  setPeriodo(b.dataset.p); startAuto();
});
carregar();
startAuto();
setInterval(carregar, 60000);
</script>
</body>
</html>
