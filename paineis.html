<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-title" content="Painel RK">
<meta name="theme-color" content="#0b0f0d">
<link rel="apple-touch-icon" href="icon-rk-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-rk-192.png">
<title>Painel RK</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:#0b0f0d;color:#eafaf1;font-family:'Segoe UI',system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
  body{display:flex;align-items:center;justify-content:center;padding:24px;background:radial-gradient(1200px 600px at 80% -10%,#16241c 0%,#0b0f0d 55%)}
  .card{background:#16211b;border:1px solid #233029;border-radius:22px;padding:40px 32px;max-width:380px;width:100%;text-align:center;box-shadow:0 8px 30px rgba(0,0,0,.35)}
  .logo{font-size:34px;font-weight:800;letter-spacing:.5px;margin-bottom:6px}
  .logo b{color:#39d353}
  .ico{font-size:44px;margin:6px 0 12px}
  h1{font-size:19px;margin-bottom:8px}
  p{color:#8fa89a;font-size:14px;line-height:1.5}
</style>
</head>
<body>
  <div class="card">
    <div class="logo">Painel <b>RK</b></div>
    <div class="ico">🛠️</div>
    <h1>Em manutenção</h1>
    <p>O painel está temporariamente fora do ar. Já já volta.</p>
  </div>
</body>
</html>
