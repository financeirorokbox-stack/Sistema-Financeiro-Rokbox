name: Deploy to GitHub Pages

on:
  # Deploy passou a ser DIRETO DO BRANCH main (Pages "legacy"/build from branch), porque o
  # pipeline de artefatos do Actions (actions/deploy-pages) estava falhando repetidamente
  # ("No artifacts named github-pages were found"). Mantido só o disparo manual caso um dia
  # se volte a usar o deploy via Actions.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
